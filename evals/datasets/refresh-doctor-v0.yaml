# Deterministic. A refresh error must match the expected pattern and point at the listed objects.
name: refresh-doctor-v0
kind: diagnose
cases:
  - id: missing-file
    fixture: retail-issues
    error: "DataSource.Error: Could not find file 'C:\\Data\\sales.csv'.\r\nDetails: C:\\Data\\sales.csv"
    pattern: file-not-found
    evidence: [Retail/Sales/partition/Sales]
  - id: missing-file-moved-folder
    fixture: retail-issues
    error: "DataSource.Error: Could not find a part of the path 'D:\\Old\\product.csv'."
    pattern: file-not-found
    evidence: [Retail/Product/partition/Product]
  - id: renamed-column-typed-step
    fixture: retail-clean
    error: "Expression.Error: The column 'UnitPrice' of the table wasn't found. Details: UnitPrice"
    pattern: column-not-found
    evidence: [Retail/Sales/partition/Sales, Retail/Sales/column/UnitPrice]
  - id: bad-number
    fixture: retail-clean
    error: "DataFormat.Error: We couldn't convert to Number. Details: N/A"
    pattern: type-conversion
    evidence: [Retail/Sales/partition/Sales]
  - id: duplicate-product-key
    fixture: retail-issues
    error: "OLE DB or ODBC error: Column 'ProductKey' in Table 'Product' contains a duplicate value '42' and this is not allowed for columns on the one side of a many-to-one relationship or for columns that are used as the primary key of a table."
    pattern: duplicate-key
    evidence: [Retail/relationship/7d1e0b2a-5c44-4f6e-8a10-1a2b3c4d5e01, Retail/Product/partition/Product]
  - id: blank-customer-key
    fixture: retail-issues
    error: "Column 'CustomerKey' in Table 'Customer' contains blank values and this is not allowed for columns on the one side of a many-to-one relationship."
    pattern: blank-key
    evidence: [Retail/relationship/7d1e0b2a-5c44-4f6e-8a10-1a2b3c4d5e02]
  - id: firewall
    fixture: retail-issues
    error: "Formula.Firewall: Query 'Sales' (step 'Merged') references other queries or steps, so it may not directly access a data source."
    pattern: formula-firewall
    evidence: []
  - id: gateway
    fixture: retail-issues
    error: "You can't schedule refresh for this semantic model because the following data sources currently don't support refresh: File"
    pattern: gateway
    evidence: [Retail/Sales/partition/Sales]
  - id: credentials
    fixture: retail-issues
    error: "The credentials provided for the SQL source are invalid. (Source at sql01;Sales.)"
    pattern: credentials
    evidence: []
  - id: memory
    fixture: retail-issues
    error: "Resource Governing: This operation was canceled because there wasn't enough memory to finish running it."
    pattern: memory
    evidence: [Retail/Sales/column/LoadBatch]
  - id: renamed-parameter
    fixture: retail-clean
    error: "Expression.Error: The name 'DataFolder' wasn't recognized. Make sure it's spelled correctly."
    pattern: missing-query
    evidence: [Retail/Sales/partition/Sales]
