    must_cite_any: [Retail/Sales/measure/Units, Retail/Sales/column/Quantity]
  - id: dates
    question: Which table should I use for dates and time intelligence?
    must_cite_any: [Retail/Calendar, Retail/Calendar/column/Date]
  - id: customers
    question: How do I count customers?
    must_cite_any: [Retail/Customer/measure/Customer Count]
