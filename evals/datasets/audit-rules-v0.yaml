# Deterministic: the auditor must find exactly the planted problems (fixtures/README.md).
name: audit-rules-v0
kind: audit-rules
cases:
  - id: clean-model-has-no-findings
    fixture: retail-clean
    expect: []

  - id: issues-model-planted-findings
    fixture: retail-issues
    expect:
      - {rule: measure-missing-description, object: Retail/Sales/measure/Total Sales}
      - {rule: measure-missing-description, object: Retail/Sales/measure/Total Cost}
      - {rule: measure-missing-description, object: Retail/Sales/measure/Profit}
      - {rule: measure-missing-description, object: Retail/Sales/measure/Margin %}
      - {rule: measure-missing-description, object: Retail/Sales/measure/Sales YoY %}
      - {rule: measure-missing-description, object: Retail/Sales/measure/Avg Order Value}
      - {rule: measure-missing-description, object: Retail/Product/measure/Product Count}
      - {rule: measure-missing-description, object: Retail/Customer/measure/Customer Count}
      - {rule: use-divide-function, object: Retail/Sales/measure/Margin %}
      - {rule: use-divide-function, object: Retail/Sales/measure/Sales YoY %}
      - {rule: avoid-floating-point, object: Retail/Sales/column/UnitPrice}
      - {rule: avoid-floating-point, object: Retail/Product/column/ListPrice}
      - {rule: avoid-bidirectional-relationship, object: Retail/relationship/7d1e0b2a-5c44-4f6e-8a10-1a2b3c4d5e02}
