# For developers: `alembic revision --autogenerate -m "..."` after changing models.py.
# The app runs migrations itself on start (datawright.db.migrate).
[alembic]
script_location = src/datawright/migrations
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url comes from DATAWRIGHT_DATA_DIR (see migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
