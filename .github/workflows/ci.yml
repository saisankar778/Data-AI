name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Evals (deterministic sets)
        run: |
          datawright evals run --set audit-rules-v1
          datawright evals run --set refresh-doctor-v0
